<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Dự Án - Pixel Bold (Light Mode)</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #FFFFFF; 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'VT323', monospace;
        }

        .container {
            text-align: center;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .char {
            display: inline-block;
            font-size: 8rem; 
            /* Màu đen xám sâu nhìn rất tối giản và cao cấp */
            color: #2D3142; 
            /* Tăng độ mượt của animation nhảy pixel */
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.2), color 0.2s ease, text-shadow 0.25s ease;
            cursor: default;
            width: 0.6em; 
            text-align: center;
            text-transform: uppercase;
            /* Bóng đổ pixel mờ nhẹ lúc bình thường */
            text-shadow: 4px 4px 0px rgba(0, 0, 0, 0.08);
        }

        /* NÂNG CẤP HIỆU ỨNG HOVER: Biến chữ thành dải màu hoàng hôn, bóng đổ 3D đậm chất Retro Pop */
        .char:hover {
            transform: translateY(-18px) scale(1.08);
            /* Màu cam đào nổi bật trên nền trắng */
            color: #ff5e62;
            /* Đổ bóng đổ kép tạo hiệu ứng khối 3D đổ bóng tầng */
            text-shadow: 
                3px 3px 0px #ff9966,
                6px 6px 0px rgba(0, 0, 0, 0.15);
        }

        @media (max-width: 800px) {
            .char { 
                font-size: 4rem; 
                width: 0.55em;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="text-target">
    </div>

    <script>
        const text = "TRANG DỰ ÁN";
        const container = document.getElementById('text-target');

        text.split('').forEach(char => {
            const span = document.createElement('span');
            span.textContent = char === ' ' ? '\u00A0' : char;
            span.className = 'char';
            container.appendChild(span);
        });
    </script>
</body>
</html>
