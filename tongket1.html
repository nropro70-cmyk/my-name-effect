<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Tổng Kết - Notion Pixel Style</title>
    <!-- Nhúng font Pixel Silkscreen hỗ trợ Tiếng Việt chuẩn 100% không lỗi dấu -->
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Giữ nền trắng tối giản sạch sẽ chuẩn Notion */
            background-color: #FAFAFA; 
            overflow: hidden;
        }

        .container {
            text-align: center;
            user-select: none;
            width: 100%;
        }

        /* Khóa chữ trên một dòng duy nhất và tạo hiệu ứng bồng bềnh nhẹ */
        .title-wrapper {
            display: inline-block;
            white-space: nowrap; 
            animation: float-slow 5s ease-in-out infinite;
        }

        /* ĐỊNH DẠNG FONT PIXEL CHUẨN - ĐỀU CHỮ - KHÔNG LO LỖI */
        .char {
            display: inline-block;
            font-family: 'Silkscreen', monospace;
            font-size: 6.5rem; /* Tối ưu lại kích thước theo font mới */
            font-weight: 700;
            text-transform: uppercase;
            
            /* Dải màu Gradient Công nghệ chuyển động mượt mà */
            background: linear-gradient(135deg, #00D2FF, #0072FF, #7928CA, #00D2FF);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-move 4s ease infinite;

            cursor: pointer;
            width: 0.8em; /* Độ rộng hoàn hảo để các chữ pixel đứng cạnh nhau */
            text-align: center;
            
            /* Đổ bóng pixel nhẹ tinh tế phía sau */
            text-shadow: 3px 3px 0px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s steps(3), filter 0.2s ease;
        }

        /* HIỆU ỨNG HOVER CÔNG NGHỆ: Chữ nảy cao và tỏa ánh sáng Neon */
        .char:hover {
            transform: translateY(-20px) scale(1.08);
            filter: drop-shadow(0 15px 15px rgba(0, 210, 255, 0.5));
        }

        /* Khoảng cách giữa chữ TRANG - TỔNG - KẾT */
        .space {
            display: inline-block;
            width: 35px;
        }

        @keyframes gradient-move {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* Tự động co giãn đều trên 1 dòng duy nhất cho mọi màn hình điện thoại */
        @media (max-width: 1200px) {
            .char { font-size: 5rem; }
            .space { width: 25px; }
        }
        @media (max-width: 850px) {
            .char { font-size: 3.5rem; }
            .space { width: 15px; }
        }
        @media (max-width: 600px) {
            .char { font-size: 2.2rem; }
            .space { width: 10px; }
        }
        @media (max-width: 400px) {
            .char { font-size: 1.6rem; }
            .space { width: 6px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="title-wrapper">
            <!-- Từ: TRANG -->
            <span class="char">T</span>
            <span class="char">R</span>
            <span class="char">A</span>
            <span class="char">N</span>
            <span class="char">G</span>
            
            <div class="space"></div>
            
            <!-- Từ: TỔNG (Gõ chữ có dấu bình thường, font tự xử lý cực chuẩn) -->
            <span class="char">T</span>
            <span class="char">Ổ</span>
            <span class="char">N</span>
            <span class="char">G</span>
            
            <div class="space"></div>
            
            <!-- Từ: KẾT -->
            <span class="char">K</span>
            <span class="char">Ế</span>
            <span class="char">T</span>
        </div>
    </div>

</body>
</html>
