<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Tổng Kết - Notion Tech Light Style</title>
    <!-- Nhúng font chữ Pixel đã được Việt hóa đầy đủ dấu -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Nền trắng xám nhẹ (Minimalist Tech White) giúp làm dịu và nổi bật màu neon */
            background-color: #FAFAFA; 
            overflow: hidden;
        }

        .container {
            text-align: center;
        }

        /* Dòng chữ TRANG TỔNG KẾT phía trên */
        .subtitle {
            font-family: 'VT323', monospace;
            font-size: 2.2rem;
            color: #4A5568; 
            opacity: 0.5;
            letter-spacing: 8px;
            margin-bottom: 25px;
            text-transform: uppercase;
            user-select: none;
            transition: all 0.3s ease;
        }
        
        /* Hiệu ứng chuyển màu nhẹ và giãn khoảng cách chữ khi rê chuột vào cụm */
        .container:hover .subtitle {
            opacity: 0.9;
            color: #00D2FF;
            letter-spacing: 12px;
        }

        /* Khung chứa tên tự động bồng bềnh nhẹ */
        .name-wrapper {
            display: inline-block;
            animation: float-slow 5s ease-in-out infinite;
        }

        /* PHỐI MÀU CÔNG NGHỆ TƯƠNG LAI (CYBERTECH LIGHT BIU) */
        .char {
            display: inline-block;
            font-family: 'VT323', monospace;
            font-size: 7rem;
            font-weight: bold;
            text-transform: uppercase;
            
            /* Dải màu Gradient: Xanh Neon (Cyan) -> Xanh Lam Điện Tử (Electric Blue) -> Tím Vi Mạch (Tech Purple) */
            background: linear-gradient(135deg, #00D2FF, #0072FF, #7928CA, #00D2FF);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-move 4s ease infinite;

            cursor: pointer;
            user-select: none;
            /* Tăng độ mượt mà khi tương tác */
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.3s ease;
        }

        /* HIỆU ỨNG HOVER CÔNG NGHỆ: Chữ nảy cao, nghiêng nhẹ và tỏa ánh sáng điện tử (Digital Glow) */
        .char:hover {
            transform: translateY(-25px) scale(1.18) rotate(-1deg);
            /* Đổ bóng kép phát xạ ánh sáng Cyan huyền ảo trên nền trắng */
            filter: drop-shadow(0 10px 15px rgba(0, 210, 255, 0.5)) 
                    drop-shadow(0 4px 6px rgba(0, 114, 255, 0.3));
        }

        /* Khoảng cách giữa các từ */
        .space {
            display: inline-block;
            width: 35px;
        }

        @keyframes gradient-move {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="subtitle">Trang Tổng Kết</div>
        
        <div class="name-wrapper">
            <span class="char">P</span>
            <span class="char">h</span>
            <span class="char">ạ</span>
            <span class="char">m</span>
            <div class="space"></div>
            <span class="char">V</span>
            <span class="char">ă</span>
            <span class="char">n</span>
            <div class="space"></div>
            <span class="char">L</span>
            <span class="char">o</span>
            <span class="char">n</span>
            <span class="char">g</span>
        </div>
    </div>

</body>
</html>
